<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">


    <title>MOMI UPGRADE ACTIVATION</title>

    <style>
      * {
        touch-action: manipulation;
        padding: 0;
        margin: 0;
        font-family: Roboto, sans-serif;
      }

      body {
        background: #111;
        color: #f00;
      }



      @keyframes GreenYellow {
        0%, 100% {
          background: #0f0;
        }

        50% {
          background: #ff0;
        }
      }

      @keyframes GreenYellowColor {
        0%, 100% {
          color: #0f0;
        }

        50% {
          color: #ff0;
        }
      }

      @keyframes ActivationBlink {
        to {
          visibility: hidden;
        }
      }

      h1 {
        text-align: center;
        margin: 8px 0;
      }
  </style>
</head>
<body>

  <main style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="border: 10px solid; padding: 16px; animation: GreenYellow 10s linear infinite; width: 324px; height: 576px; display: flex; flex-direction: column; justify-content: space-evenly; box-sizing: border-box;">


      <h1 style="font-size: 52px;"><span class="blink1">↓︎</span><br><span class="blink1">→︎</span> MoMI <span class="blink1">←︎</span><br><span class="blink1">↑</span></h1>
      <h1 style="font-size: 28px">SITE<br>INTER-<br>RUPTION</h1>

      <h1 style="font-size: 44px"><span class="blink2">↓︎</span><br><span class="blink2">→︎</span> 4/16 <span class="blink2">←︎</span><br><span class="blink2">↑</span></h1>

    </div>
  </main>



</body>

<script type="module">
  import {$, SoundSrc, getQueryParam, css} from './utils.js'


  const interval = Number(getQueryParam('interval')) || 1000
  const freq = Number(getQueryParam('freq')) || 300

  const freqLen = Math.min(300, interval/2)


  let clicked
  document.onclick = () => {
    if (!clicked) {
      clicked = true
      const s = new SoundSrc('square')
      setInterval(() => {
        s.note(freq, freqLen)
      }, interval)



      console.log($.cls('blink1'), $.cls('blink2'))



      $.cls('blink1').forEach(e => {
        e.style.animation = 'ActivationBlink 1s steps(2, start) -0.5s infinite'
      })
      $.cls('blink2').forEach(e => {
        e.style.animation = 'ActivationBlink 1s steps(2, start) infinite'
      })
    }
  }

</script>

</html>
