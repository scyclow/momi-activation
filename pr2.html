<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">


    <title>MOMI UPGRADE ACTIVATION</title>

    <style>
      * {
        touch-action: manipulation;
        padding: 0;
        margin: 0;
        font-family: Roboto, sans-serif;
      }

      body {
        color: #f00;
      }



      @keyframes GreenYellow {
        0%, 100% {
          background: #0f0;
        }

        50% {
          background: #ff0;
        }
      }

      @keyframes GreenYellowColor {
        0%, 100% {
          color: #0f0;
        }

        50% {
          color: #ff0;
        }
      }

      @keyframes ActivationBlink {
        to {
          visibility: hidden;
        }
      }

      h1 {
        text-align: center;
        margin: 8px 0;
      }
  </style>
</head>
<body>

  <main style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="border: 10px solid; padding: 16px; animation: GreenYellow 10s linear infinite; width: 324px; height: 576px; display: flex; flex-direction: column; justify-content: space-evenly;">

      <h1 style="font-size: 56px;"><span style="animation: ActivationBlink 1s steps(2, start)  -0.5s infinite;">↓</span><br><span style="animation: ActivationBlink 1s steps(2, start) -0.5s infinite;">→</span> MoMI <span style="animation: ActivationBlink 1s steps(2, start)  -0.5s infinite;">←</span><br><span style="animation: ActivationBlink 1s steps(2, start)  -0.5s infinite;">↑</span></h1>
      <h1>SITE<br>INTER-<br>RUPTIONS</h1>

      <h1 style="font-size: 48px"><span style="animation: ActivationBlink 1s steps(2, start)  -0s infinite;">↓</span><br><span style="animation: ActivationBlink 1s steps(2, start) -0s infinite;">→</span> 4/16 <span style="animation: ActivationBlink 1s steps(2, start) -0s infinite;">←</span><br><span style="animation: ActivationBlink 1s steps(2, start)  -0s infinite;">↑</span></h1>

    </div>
  </main>



</body>
</html>
