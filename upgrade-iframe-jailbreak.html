<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">


    <title>MOMI UPGRADE ACTIVATION</title>

    <style>
      * {
        touch-action: manipulation;
        padding: 0;
        margin: 0;
        font-family: Roboto, sans-serif
      }


      a,abbr,acronym,address,applet,article,aside,audio,b,big,blockquote,body,canvas,caption,center,cite,code,dd,del,details,dfn,div,dl,dt,em,embed,fieldset,figcaption,figure,footer,form,h1,h2,h3,h4,h5,h6,header,hgroup,html,i,iframe,img,ins,kbd,label,legend,li,mark,menu,nav,object,ol,output,p,pre,q,ruby,s,samp,section,small,span,strike,strong,sub,summary,sup,table,tbody,td,tfoot,th,thead,time,tr,tt,u,ul,var,video
      {
        margin:0;
        padding:0;
        border:0;
        font-size:100%;
        vertical-align:baseline;
        line-height: 1;
        font-style: normal;
      }

      button,input,select,textarea {
        font-size: 100%;
        margin: 0;
        vertical-align: baseline;
      }


      h1, h2, h3, h4, h5, h6 {
        line-height: 1.1;
        margin: 0 0 20px;
        font-weight: 900;
      }


      @keyframes ActivationBlink {
        to {
          visibility: hidden;
        }
      }


      @keyframes GreenYellow {
        0%, 100% {
          background: #0f0;
        }

        50% {
          background: #ff0;
        }
      }

      @keyframes GreenYellowColor {
        0%, 100% {
          color: #0f0;
        }

        50% {
          color: #ff0;
        }
      }

      @keyframes BorderBlink {
        0%, 100% {
          outline: 3px solid;
        }

        50% {
          outline: 3px none;
        }
      }

      ::selection {
          background: #000;
          color: #fff
      }
    </style>

  </head>

  <body></body>

  <script type="module">
  import {mountPopupTimeout} from './momi-activation.js'

  // mountPopupTimeout(1500, { opacity: 0.7, displayX: true, stableGeneratorPrice: true})
  mountPopupTimeout(45000, {
    opacity: 0,
    displayX: true,
    stableGeneratorPrice: true,
    constantPopupTime: true,
    // popupXOverride: '10vw',
    // popupYOverride: 'calc(90vh - 240px)',
    topDocument: top.document,
    showTombstoneMarquee: true,
    pageYOffsetMount: 565 - (
      Math.min(1, Math.max((900 - (1220 - window.innerWidth))/900, 0)) * 100
    ),
    onLoad: () => {
      top.document.querySelector('.momileakout-modal').classList.add('active')
      top.document.querySelector('.momileakout-modal-close').style.display = 'none'
      top.document.querySelector('.momileakout-attribution').classList.remove('active')
      top.document.querySelector('#momi_leakout_toggle').style.display = 'block'
      top.document.querySelector('.momileakout-modal-tint').style.display = 'none'
      top.document.querySelector('.momileakout-modal').style.pointerEvents = 'none'
      top.document.querySelector('.momileakout-modal-iframe').style.pointerEvents = 'none'
    },
    onPopupAction: () => {
      document.getElementById('momi-activation-popup', top.document).style.display = 'none'
      top.document.querySelector('.momileakout-modal').style.pointerEvents = 'all'
      top.document.querySelector('.momileakout-modal-iframe').style.pointerEvents = 'all'
    },
    onClose: () => {

      const xSVG = `
        <svg id="xSVG" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#000000" version="1.1" viewBox="0 0 460.775 460.775" xml:space="preserve">
        <path d="M285.08,230.397L456.218,59.27c6.076-6.077,6.076-15.911,0-21.986L423.511,4.565c-2.913-2.911-6.866-4.55-10.992-4.55  c-4.127,0-8.08,1.639-10.993,4.55l-171.138,171.14L59.25,4.565c-2.913-2.911-6.866-4.55-10.993-4.55  c-4.126,0-8.08,1.639-10.992,4.55L4.558,37.284c-6.077,6.075-6.077,15.909,0,21.986l171.138,171.128L4.575,401.505  c-6.074,6.077-6.074,15.911,0,21.986l32.709,32.719c2.911,2.911,6.865,4.55,10.992,4.55c4.127,0,8.08-1.639,10.994-4.55  l171.117-171.12l171.118,171.12c2.913,2.911,6.866,4.55,10.993,4.55c4.128,0,8.081-1.639,10.992-4.55l32.709-32.719  c6.074-6.075,6.074-15.909,0-21.986L285.08,230.397z"/>
        </svg>
      `
      const tombstoneMarkup = `

        <style>
          #xSVG {
            width: 16px;
          }
          @media (max-width: 630px) {
            #xSVG {
              width: 12px;
            }
            #tombstoneOverlay {
              font-size: 1em !important;
            }

            #tombstoneContent {
              padding: 32px !important;
              padding-top: 0 !important;
            }
          }
        </style>
        <div
          id="tombstoneOverlay"
          style="
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 1.1em
          "
        >
          <div
            id="tombstoneOpacity"
            style="
              width: 100vw;
              height: 100vh;
              background: #000;
              opacity: 0.7;

              position: fixed;
              left: 0;
              top: 0;
              cursor: pointer;
            "
          ></div>

          <div
            style="
              z-index: 3;
              background: #fff;
            "
          >
            <div style="display: flex; justify-content: end; width: 100%">
              <div id="xCloseTombstone" style="cursor: pointer; padding: 10px; height: 34px; user-select: none">${xSVG}</div>
            </div>

            <div id="tombstoneContent" style="padding: 34px 80px; padding-top: 0">
              <h4 style="text-align: center; margin-bottom: 16px">This Site Interruption was brought to you by:</h4>
              <h4 style="text-align: center; margin-bottom: 0">Steve Pikelny</h4>
              <p style="text-align: center">b. 1989, United States</p>
              <p style="text-align: center"><em>MoMI Upgrade Activation</em>, 2026</p>
              <p style="text-align: center">JavaScript, HTML/CSS, Webpage</p>

              <p style="text-align: center; margin-top: 1em">Learn more about the series at MoMI <a href="#" style="text-decoration: underline; color: #000;">here</a>.</p>
            </div>
          </div>

        </div>
      `

      const tombstone = $.div(tombstoneMarkup, {
        style: `
          z-index: 5000;
          position: fixed;
          top: 0;
          left: 0;
        `
      })
      document.body.appendChild(tombstone)

      const close = () => {
        document.getElementById('tombstoneOverlay').remove()
      }

      document.getElementById('tombstoneOpacity').onclick = close
      document.getElementById('xCloseTombstone').onclick = close
    }
  })
  </script>
</html>
