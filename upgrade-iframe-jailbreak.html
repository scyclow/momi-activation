<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">


    <title>MOMI UPGRADE ACTIVATION</title>

    <style>
      * {
        touch-action: manipulation;
        padding: 0;
        margin: 0;
        font-family: Roboto, sans-serif
      }


      a,abbr,acronym,address,applet,article,aside,audio,b,big,blockquote,body,canvas,caption,center,cite,code,dd,del,details,dfn,div,dl,dt,em,embed,fieldset,figcaption,figure,footer,form,h1,h2,h3,h4,h5,h6,header,hgroup,html,i,iframe,img,ins,kbd,label,legend,li,mark,menu,nav,object,ol,output,p,pre,q,ruby,s,samp,section,small,span,strike,strong,sub,summary,sup,table,tbody,td,tfoot,th,thead,time,tr,tt,u,ul,var,video
      {
        margin:0;
        padding:0;
        border:0;
        font-size:100%;
        vertical-align:baseline;
        line-height: 1;
        font-style: normal;
      }

      button,input,select,textarea {
        font-size: 100%;
        margin: 0;
        vertical-align: baseline;
      }


      h1, h2, h3, h4, h5, h6 {
        line-height: 1.1;
        margin: 0 0 20px;
        font-weight: 900;
      }


      @keyframes ActivationBlink {
        to {
          visibility: hidden;
        }
      }


      @keyframes GreenYellow {
        0%, 100% {
          background: #0f0;
        }

        50% {
          background: #ff0;
        }
      }

      @keyframes GreenYellowColor {
        0%, 100% {
          color: #0f0;
        }

        50% {
          color: #ff0;
        }
      }

      @keyframes BorderBlink {
        0%, 100% {
          outline: 3px solid;
        }

        50% {
          outline: 3px none;
        }
      }

      ::selection {
          background: #000;
          color: #fff
      }
    </style>

  </head>

  <body></body>

  <script type="module">
  // import {mountPopupTimeout} from './momi-activation.js'
  import {mountBottomBanner} from './momi-activation.js'
  import {mountTombstone} from './tombstone.js'


  const onClose = (doc) => {
    mountTombstone(document.body, () => {
      doc.querySelector('.momileakout-modal').classList.remove('active')
    })


  }

  const onLoad = (doc) => {
    doc.querySelector('.momileakout-modal-close').style.display = 'none'
    doc.querySelector('.momileakout-attribution').classList.remove('active')
    doc.querySelector('#momi_leakout_toggle').style.display = 'block'
    doc.querySelector('.momileakout-modal-tint').style.display = 'none'
    doc.querySelector('.momileakout-modal').style.pointerEvents = 'none'
    doc.querySelector('.momileakout-modal-iframe').style.pointerEvents = 'none'
  }

  const onPopupAction = (doc) => {
    // doc.getElementById('momi-activation-popup').style.display = 'none'
    doc.querySelector('.momileakout-modal').classList.add('active')
    doc.querySelector('.momileakout-attribution').style.pointerEvents = 'all'
    doc.querySelector('.momileakout-modal').style.pointerEvents = 'all'
    doc.querySelector('.momileakout-modal-iframe').style.pointerEvents = 'all'
  }

  // mountPopupTimeout(45000, {
  //   opacity: 0.7,
  //   displayX: true,
  //   stableGeneratorPrice: true,
  //   constantPopupTime: true,
  //   // popupXOverride: '10vw',
  //   // popupYOverride: 'calc(90vh - 240px)',
  //   topDocument: top.document,
  //   showTombstoneMarquee: true,
  //   pageYOffsetMount: 565 - (
  //     Math.min(1, Math.max((900 - (1220 - window.innerWidth))/900, 0)) * 100
  //   ),
  //   onLoad,
  //   onPopupAction,
  //   onClose,
  // })



  mountBottomBanner(1000, {
    onLoad,
    onClose,
    onPopupAction,
    opacity: 0.7,
    displayX: true,
    topDocument: top.document,
    stableGeneratorPrice: true,
  })
  </script>
</html>
